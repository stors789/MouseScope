                            ['<code>light_box_length_cm</code> / <code>dark_box_length_cm</code> etc.', 'Light/dark chamber dimensions, shared-edge length, template layout, and inferred adjacent physical side.', 'Use these fields to verify that the rectified trajectory map matches the real apparatus.'],
                            ['<code>total_distance_cm</code> / <code>mean_speed_cm_s</code> / <code>max_speed_cm_s</code>', 'Auxiliary total distance, average speed, and max speed.', 'Useful for activity and QC review; not a core LDB conclusion.'],
                            ['<code>light_distance_cm</code> / <code>dark_distance_cm</code> / <code>doorway_distance_cm</code>', 'Auxiliary distance accumulated inside each zone.', 'Can help separate occupancy preference from movement volume, but depends on floor scale.'],
                            ['<code>moving_time_s</code> / <code>immobility_time_s</code>', 'Movement and low-motion time based on speed threshold.', 'Supports activity / QC interpretation.']
                        ]
                    },
                    binsTable: {
                        headers: ['Field', 'Meaning', 'How to interpret it'],
                        rows: [
                            ['<code>bin_index</code> / <code>start_s</code> / <code>end_s</code> / <code>duration_s</code>', 'Time-bin metadata.', 'The final bin may be shorter than the requested bin size.'],
                            ['<code>light_time_s</code> / <code>dark_time_s</code> / <code>doorway_time_s</code>', 'Zone occupancy inside the bin.', 'Useful for plotting light exploration over time.'],
                            ['<code>transitions</code>', 'Transition count inside the bin.', 'Shows whether exploration is early or late.'],
                            ['<code>distance_cm</code> / <code>mean_speed_cm_s</code>', 'Auxiliary distance and speed inside the bin.', 'Use only for activity / QC dynamics; it does not change core LDB statistics.']
                        ]
                    },
                    callouts: [
                        ['danger', 'What to review before formal statistics', 'Review zone labels, trajectory continuity, door-seam false positives, oversized doorway exclusion, and <code>transition_event</code> in annotated videos. If summary and visual impression conflict, correct zones or parameters and rerun.']
                    ]
                },
                batch: {
                    title: 'Batch Workflow',
                    lead: 'Batch LDB analysis uses per-video setup followed by one combined run. Configure every video before starting the batch.',
                    steps: [
                        'Upload multiple LDB videos and set global timing, FPS override, and output folder.',
                        'Open each video card and confirm the light zone, dark zone, optional doorway, and detection mask. If distance / speed exports are needed, also confirm the optional floor scale.',
                        'Name each ROI and set any precise time window needed.',
                        'Tune detection and preview both compartments, especially the dark chamber and dark passage seams.',
                        'Save the video setup and return to Analysis Configuration before moving to the next video.',
                        'Start batch analysis only after all video cards are complete.'
                    ],
                    rules: [
                        'Each video stores its own ROIs, masks, time windows, and tuning parameters.',
                        'Multiple ROIs inside one video share the detection and statistics parameters for that video.',
                        'Missing light / dark zones or invalid doorway / mask polygons block batch start.',
                        'ZIP downloads preserve the per-video output folder structure.'
                    ]
                },
                troubleshooting: {
                    title: 'Common Issues and Troubleshooting',
                    lead: 'Start with the annotated video and, when tracking is reliable, the track CSV; then interpret the summary. Most issues come from boundaries, dark-compartment detection, door-seam false positives, or timing.',
                    items: [
                        'Light time too high: check whether the light zone is too wide, dark detection is failing, or pre-door-opening frames were included.',
                        'Light time too low: check whether the light zone is too narrow, glare breaks the mouse contour, or <code>door_open_delay_s</code> is too long.',
                        'Transitions too high: increase <code>transition_min_dwell_s</code>; if door seams are falsely detected, draw a narrow doorway ignore band.',
                        'No transitions: confirm there is no gap between zones, the mouse really crosses chambers, and dark-chamber detection is not lost.',
                        'Frequent <code>Unknown</code>: usually indicates a gap between zones or uncovered centroid locations.',
                        'Low detection rate: tune <code>bg_type</code>, <code>gray_threshold</code>, <code>min_area</code>, try static background subtraction, or redraw the mask.'
                    ],
                    callouts: [
                        ['warning', 'When rerun is required', 'Rerun analysis after changing zones, time windows, door delay, transition stability, doorway reset, or detection parameters because all of them can change the final summary.']
                    ]
                }
            }
        }
    };

    function renderList(items, ordered) {
        const tag = ordered ? 'ol' : 'ul';
        return `<${tag} class="${ordered ? 'manual-step-list' : 'manual-list'}">${(items || []).map(item => `<li>${item}</li>`).join('')}</${tag}>`;
    }

    function renderCards(cards) {
        return `
            <div class="manual-hero-grid">
                ${(cards || []).map(card => `
                    <div class="manual-mini-card">
                        <h4><i class="${card[0]}" style="color: var(--primary-color);"></i><span>${card[1]}</span></h4>
                        <p>${card[2]}</p>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function renderBlocks(blocks) {
        return (blocks || []).map(block => `
            <div class="manual-sub-block">
                <h4><i class="${block.icon}" style="color: var(--primary-color);"></i><span>${block.title}</span></h4>
                ${renderList(block.items, false)}
            </div>
        `).join('');
    }

    function renderCallouts(callouts) {
        return (callouts || []).map(item => `
            <div class="manual-callout ${item[0]}">
                <h4>${item[1]}</h4>
                <p>${item[2]}</p>
            </div>
        `).join('');
    }

    function renderFileGrid(files) {
        return `
            <div class="manual-file-grid">
                ${(files || []).map(file => `
                    <div class="manual-file-card">
                        <h4><i class="fas fa-file-alt" style="color: var(--primary-color);"></i><span>${file[0]}</span></h4>
                        <p>${file[1]}</p>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function render(lang) {
        const copy = LDB_MANUAL[lang] || LDB_MANUAL.zh;
        const s = copy.sections || {};
        const root = document.getElementById('ldb-manual-root');
        if (!root) return;
        root.innerHTML = `
            <div class="manual-hero">
                <div class="manual-hero-top">
                    <div>
                        <div class="manual-eyebrow">${copy.heroEyebrow}</div>
                        <h2>${copy.heroTitle}</h2>
                        <p>${copy.heroSubtitle}</p>
                    </div>
                </div>
                ${renderCards(copy.heroCards)}
            </div>

            ${window.manualRenderFlow(copy.flow)}

            <div class="row">
                <div class="col-lg-3 mb-4">
                    <div class="nav-sidebar list-group sticky-top" style="top: 20px; z-index: 1;">
                        ${copy.nav.map((item, index) => `
                            <a href="#${item[0]}" class="list-group-item list-group-item-action">
                                <span class="step-number" style="width:26px;height:26px;font-size:0.8rem;">${index + 1}</span><span>${item[1]}</span>
                            </a>
                        `).join('')}
                    </div>
                </div>
                <div class="col-lg-9">
                    <div class="manual-section" id="overview">
                        <h3><span class="step-number">1</span><span>${s.overview.title}</span></h3>
                        <p>${s.overview.lead}</p>
                        ${renderList(s.overview.points, false)}
                        ${renderCallouts(s.overview.callouts)}
                    </div>

                    <div class="manual-section" id="recording">
                        <h3><span class="step-number">2</span><span>${s.recording.title}</span></h3>
                        <p>${s.recording.lead}</p>
                        ${renderBlocks(s.recording.blocks)}
                        ${renderCallouts(s.recording.callouts)}
                    </div>

                    <div class="manual-section" id="upload">
                        <h3><span class="step-number">3</span><span>${s.upload.title}</span></h3>
                        <p>${s.upload.lead}</p>
                        ${renderList(s.upload.points, false)}
                        ${renderCallouts(s.upload.callouts)}
                    </div>

                    <div class="manual-section" id="calibration">
                        <h3><span class="step-number">4</span><span>${s.calibration.title}</span></h3>
                        <p>${s.calibration.lead}</p>
                        ${renderBlocks(s.calibration.blocks)}
                        <div class="manual-caption"><i class="fas fa-clock" style="color: var(--primary-color);"></i><span>${lang === 'en' ? 'ROI time-window modes' : 'ROI 时间窗模式'}</span></div>
                        ${window.manualRenderTable(s.calibration.timeTable.headers, s.calibration.timeTable.rows)}
                        ${renderCallouts(s.calibration.callouts)}
                    </div>

                    <div class="manual-section" id="params">
                        <h3><span class="step-number">5</span><span>${s.params.title}</span></h3>
                        <p>${s.params.lead}</p>
                        <div class="manual-caption"><i class="fas fa-search" style="color: var(--primary-color);"></i><span>${lang === 'en' ? 'Detection parameters' : '检测参数'}</span></div>
                        ${window.manualRenderTable(s.params.detectTable.headers, s.params.detectTable.rows)}
                        <div class="manual-caption"><i class="fas fa-chart-line" style="color: var(--primary-color);"></i><span>${lang === 'en' ? 'Core and auxiliary parameters' : '核心与辅助参数'}</span></div>
                        ${window.manualRenderTable(s.params.statsTable.headers, s.params.statsTable.rows)}
                        ${renderCallouts(s.params.callouts)}
                    </div>

                    <div class="manual-section" id="outputs">
                        <h3><span class="step-number">6</span><span>${s.outputs.title}</span></h3>
                        <p>${s.outputs.lead}</p>
                        ${renderFileGrid(s.outputs.files)}
                        <div class="manual-caption"><i class="fas fa-table" style="color: var(--primary-color);"></i><span><code>*_track.csv</code></span></div>
                        ${window.manualRenderTable(s.outputs.trackTable.headers, s.outputs.trackTable.rows)}
                        <div class="manual-caption"><i class="fas fa-table" style="color: var(--primary-color);"></i><span><code>*_summary.csv</code></span></div>
                        ${window.manualRenderTable(s.outputs.summaryTable.headers, s.outputs.summaryTable.rows)}
                        <div class="manual-caption"><i class="fas fa-table" style="color: var(--primary-color);"></i><span><code>*_bins.csv</code></span></div>
                        ${window.manualRenderTable(s.outputs.binsTable.headers, s.outputs.binsTable.rows)}
                        ${renderCallouts(s.outputs.callouts)}
                    </div>

                    <div class="manual-section" id="batch">
                        <h3><span class="step-number">7</span><span>${s.batch.title}</span></h3>
                        <p>${s.batch.lead}</p>
                        ${renderList(s.batch.steps, true)}
                        <div class="manual-sub-block">
                            <h4><i class="fas fa-check-double" style="color: var(--primary-color);"></i><span>${lang === 'en' ? 'Rules that matter in practice' : '真正需要记住的规则'}</span></h4>
                            ${renderList(s.batch.rules, false)}
                        </div>
                    </div>

                    <div class="manual-section" id="troubleshooting">
                        <h3><span class="step-number">8</span><span>${s.troubleshooting.title}</span></h3>
                        <p>${s.troubleshooting.lead}</p>
                        ${renderList(s.troubleshooting.items, false)}
                        ${renderCallouts(s.troubleshooting.callouts)}
                    </div>
                </div>
            </div>
        `;
        document.dispatchEvent(new CustomEvent('mousescope:manualrendered'));
    }

    function renderCurrent() {
        const lang = window.manualCurrentLang ? window.manualCurrentLang() : 'zh';
        render(lang);
    }

    document.addEventListener('DOMContentLoaded', renderCurrent);
    document.addEventListener('mousescope:langchange', renderCurrent);
})();
</script>
