                            ['<code>area_px</code>', 'Detected animal contour area.', 'Sudden abnormal changes suggest false detection or missed detection.'],
                            ['<code>bbox_x</code> / <code>bbox_y</code> / <code>bbox_w</code> / <code>bbox_h</code>', 'Bounding box of the detected contour.', 'Helps confirm that detection is on the animal.']

                    summaryTable: {

                        rows: [

                            ['<code>roi_id</code> / <code>roi_name</code>', 'Cylinder index and name.', 'One row per cylinder.'],

                            ['<code>total_time_s</code>', 'Total duration included in statistics.', 'Only this ROI own time window is counted.'],
                            ['<code>detected_frames</code> / <code>total_frames</code>', 'Detected frames and total frames in the window.', 'Basic tracking-quality check.'],
                            ['<code>detected_rate_percent</code>', 'Detection success rate inside the window.', 'Low values reduce result reliability.'],
                            ['<code>detected_time_s</code>', 'Total duration with successful detection.', 'Compare with total_time_s to estimate missed tracking.'],
                            ['<code>immobility_time_s</code> / <code>active_time_s</code> / <code>uncertain_time_s</code>', 'Duration of immobile, active, and uncertain states.', 'High uncertain time should trigger detection QC.'],
                            ['<code>immobility_percent</code> / <code>active_percent</code> / <code>uncertain_percent</code>', 'State percentages over total analyzed duration.', 'The most common formal readout is immobility_percent.'],

                            ['<code>latency_to_immobility_s</code>', 'Latency to first immobility.', 'Empty if immobility never occurs.'],

                            ['<code>cylinder_diameter_cm</code> / <code>diameter_px</code> / <code>cm_per_px</code>', 'Real diameter, pixel diameter, and cm-per-pixel scale.', 'Very important for cross-video comparison.'],
                            ['<code>has_custom_detection_mask</code>', 'Whether a custom detection mask was used.', 'Helps explain detection-area and detection-rate differences.']
                        ]
                    },
                    binsTable: {
                        headers: ['Field', 'Meaning', 'How to interpret it'],
                        rows: [
                            ['<code>bin_index</code>', 'Temporal bin index.', 'Starts from 0.'],
                            ['<code>start_s</code> / <code>end_s</code>', 'Start and end seconds within the statistics window.', 'These are window-relative times, not absolute video times.'],
                            ['<code>duration_s</code>', 'Actual duration covered by this bin.', 'The final bin may be shorter than bin_seconds.'],
                            ['<code>detected_rate_percent</code>', 'Detection rate in this bin.', 'Locates time periods with unstable tracking.'],
                            ['<code>immobility_time_s</code> / <code>active_time_s</code> / <code>uncertain_time_s</code>', 'State durations in this bin.', 'Useful for checking whether immobility increases over time.'],
                            ['<code>immobility_percent</code>', 'Immobility percent in this bin.', 'Useful for time-trend plots or segmented statistics.'],
                            ['<code>mean_motion_score</code>', 'Mean motion score in this bin.', 'Can be cross-checked against the activity curve.']

                    },
                    callouts: [
                        ['success', 'Recommended review order', 'Start with <code>*_activity_curve.png</code> to judge the threshold line, then inspect <code>*_ethogram.png</code> for state transitions, and finally sample <code>*_analyzed.mp4</code> to confirm contour and ROI quality.']
                    ]
                },
                batch: {
                    title: 'Batch Workflow',
                    lead: 'The correct FST batch workflow is: configure each video separately, including cylinder ROIs, diameter lines, optional waterline / masks, and time windows; after all videos are complete, start the batch.',
                    steps: [
                        'Choose FST on the upload page, import multiple videos, and set global time range, FPS override, and output folder.',
                        'On the calibration page, use the video selector to inspect each video and default cylinder diameter.',
                        'Add cylinder ROIs for the current video and name each cylinder.',
                        'Draw a diameter line for every cylinder and enter the real inner diameter. Add waterline and detection mask if useful.',
                        'Select <code>global</code>, <code>relative</code>, or <code>precise</code> timing for each cylinder and fill in the corresponding bounds.',
                        'Move to tuning, adjust detection parameters, refresh preview, and confirm stable detection in every cylinder.',
                        'Repeat for the next video until all videos are configured.',
                        'Start batch analysis. The system processes videos in order and writes CSV files, reports, ethogram, activity curve, and optional annotated video into each video result folder.'

                    rules: [
                        'In batch mode, <strong>each video</strong> has independent ROIs, diameter lines, time windows, detection masks, and tuning parameters.',

                        ['info', 'Multi-cylinder consistency', 'If left and right cylinders have very different lighting, solve segmentation with masking or acquisition improvements first. Per-ROI automatic thresholds cannot fix severe foreground-segmentation imbalance by themselves.']

                    title: 'Common Issues and Troubleshooting',
                    lead: 'If FST finishes but does not match manual observation, troubleshoot in this order: contour detection, ROI / diameter, threshold figure, then time window.',

                        'Animal is missed or detection rate is low: check background type, grayscale threshold, whether ROI crops the animal, water-surface highlights, and whether the detection mask is too narrow.',
                        'Reflections or cylinder edges are detected as animal: check exposure, background, and ROI boundaries first, then adjust min_area or morphology.',
                        'Clear floating is labeled active: inspect the activity curve. If true floating sits above the threshold, increase threshold_sensitivity or use a higher manual threshold. Also check for water-surface noise inflating optical flow.',
                        'Clear swimming is labeled immobile: reduce threshold_sensitivity or manual threshold, and check whether smoothing_window_s or gap_merge_s is too large.',

                    callouts: [
                        ['danger', 'Required QC before formal statistics', 'Before using results in figures, reports, or formal statistics, review at least representative and abnormal samples with <code>*_activity_curve.png</code>, <code>*_ethogram.png</code>, and <code>*_analyzed.mp4</code>. Automatic thresholding is a starting point, not a replacement for researcher review.']
                    ]
                }
            }

    };

    function renderList(items, ordered) {
        const tag = ordered ? 'ol' : 'ul';
        return `<${tag} class="${ordered ? 'manual-step-list' : 'manual-list'}">${(items || []).map(item => `<li>${item}</li>`).join('')}</${tag}>`;
    }

    function renderCards(cards) {
        return `
            <div class="manual-hero-grid">
                ${(cards || []).map(card => `
                    <div class="manual-mini-card">
                        <h4><i class="${card[0]}" style="color: var(--primary-color);"></i><span>${card[1]}</span></h4>
                        <p>${card[2]}</p>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function renderBlocks(blocks) {
        return (blocks || []).map(block => `
            <div class="manual-sub-block">
                <h4><i class="${block.icon}" style="color: var(--primary-color);"></i><span>${block.title}</span></h4>
                ${renderList(block.items, false)}
            </div>
        `).join('');
    }

    function renderCallouts(callouts) {
        return (callouts || []).map(item => `
            <div class="manual-callout ${item[0]}">
                <h4>${item[1]}</h4>
                <p>${item[2]}</p>
            </div>
        `).join('');
    }

    function renderFileGrid(files) {
        return `
            <div class="manual-file-grid">
                ${(files || []).map(file => `
                    <div class="manual-file-card">
                        <h4><i class="fas fa-file-alt" style="color: var(--primary-color);"></i><span>${file[0]}</span></h4>
                        <p>${file[1]}</p>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function render(lang) {
        const copy = FST_MANUAL[lang] || FST_MANUAL.zh;
        const s = copy.sections || {};
        const root = document.getElementById('fst-manual-root');
        if (!root) return;
        root.innerHTML = `
            <div class="manual-hero">
                <div class="manual-hero-top">
                    <div>
                        <div class="manual-eyebrow">${copy.heroEyebrow}</div>
                        <h2>${copy.heroTitle}</h2>
                        <p>${copy.heroSubtitle}</p>
                    </div>
                    <div class="manual-chip-row">
                        ${copy.heroChips.map(chip => `<span class="manual-chip">${chip}</span>`).join('')}
                    </div>
                </div>
                ${renderCards(copy.heroCards)}
            </div>

            ${window.manualRenderFlow(copy.flow)}

            <div class="row">
                <div class="col-lg-3 mb-4">
                    <div class="nav-sidebar list-group sticky-top" style="top: 20px; z-index: 1;">
                        ${copy.nav.map((item, index) => `
                            <a href="#${item[0]}" class="list-group-item list-group-item-action">
                                <span class="step-number" style="width:26px;height:26px;font-size:0.8rem;">${index + 1}</span><span>${item[1]}</span>
                            </a>
                        `).join('')}
                    </div>
                </div>
                <div class="col-lg-9">
                    <div class="manual-section" id="overview">
                        <h3><span class="step-number">1</span><span>${s.overview.title}</span></h3>
                        <p>${s.overview.lead}</p>
                        ${renderList(s.overview.points, false)}
                        ${renderCallouts(s.overview.callouts)}
                    </div>

                    <div class="manual-section" id="recording">
                        <h3><span class="step-number">2</span><span>${s.recording.title}</span></h3>
                        <p>${s.recording.lead}</p>
                        ${renderBlocks(s.recording.blocks)}
                        ${renderCallouts(s.recording.callouts)}
                    </div>

                    <div class="manual-section" id="upload">
                        <h3><span class="step-number">3</span><span>${s.upload.title}</span></h3>
                        <p>${s.upload.lead}</p>
                        ${renderList(s.upload.points, false)}
                        ${renderCallouts(s.upload.callouts)}
                    </div>

                    <div class="manual-section" id="calibration">
                        <h3><span class="step-number">4</span><span>${s.calibration.title}</span></h3>
                        <p>${s.calibration.lead}</p>
                        ${renderBlocks(s.calibration.blocks)}
                        <div class="manual-caption"><i class="fas fa-clock" style="color: var(--primary-color);"></i><span>${lang === 'en' ? 'ROI time-window modes' : 'ROI 时间窗模式'}</span></div>
                        ${window.manualRenderTable(s.calibration.timeTable.headers, s.calibration.timeTable.rows)}
                        ${renderCallouts(s.calibration.callouts)}
                    </div>

                    <div class="manual-section" id="params">
                        <h3><span class="step-number">5</span><span>${s.params.title}</span></h3>
                        <p>${s.params.lead}</p>
                        <div class="manual-caption"><i class="fas fa-sliders-h" style="color: var(--primary-color);"></i><span>${lang === 'en' ? 'Detection parameters' : '检测参数'}</span></div>
                        ${window.manualRenderTable(s.params.detectTable.headers, s.params.detectTable.rows)}
                        <div class="manual-caption"><i class="fas fa-chart-area" style="color: var(--primary-color);"></i><span>${lang === 'en' ? 'Scoring and threshold parameters' : '评分与阈值参数'}</span></div>
                        ${window.manualRenderTable(s.params.scoringTable.headers, s.params.scoringTable.rows)}
                        ${renderCallouts(s.params.callouts)}
                    </div>

                    <div class="manual-section" id="outputs">
                        <h3><span class="step-number">6</span><span>${s.outputs.title}</span></h3>
                        <p>${s.outputs.lead}</p>
                        ${renderFileGrid(s.outputs.files)}
                        <div class="manual-caption"><i class="fas fa-table" style="color: var(--primary-color);"></i><span><code>*_track.csv</code></span></div>
                        ${window.manualRenderTable(s.outputs.trackTable.headers, s.outputs.trackTable.rows)}
                        <div class="manual-caption"><i class="fas fa-table" style="color: var(--primary-color);"></i><span><code>*_summary.csv</code></span></div>
                        ${window.manualRenderTable(s.outputs.summaryTable.headers, s.outputs.summaryTable.rows)}
                        <div class="manual-caption"><i class="fas fa-table" style="color: var(--primary-color);"></i><span><code>*_bins.csv</code></span></div>
                        ${window.manualRenderTable(s.outputs.binsTable.headers, s.outputs.binsTable.rows)}
                        ${renderCallouts(s.outputs.callouts)}
                    </div>

                    <div class="manual-section" id="batch">
                        <h3><span class="step-number">7</span><span>${s.batch.title}</span></h3>
                        <p>${s.batch.lead}</p>
                        ${renderList(s.batch.steps, true)}
                        <div class="manual-sub-block">
                            <h4><i class="fas fa-check-double" style="color: var(--primary-color);"></i><span>${lang === 'en' ? 'Rules that matter in practice' : '真正需要记住的规则'}</span></h4>
                            ${renderList(s.batch.rules, false)}
                        </div>
                        ${renderCallouts(s.batch.callouts)}
                    </div>

                    <div class="manual-section" id="troubleshooting">
                        <h3><span class="step-number">8</span><span>${s.troubleshooting.title}</span></h3>
                        <p>${s.troubleshooting.lead}</p>
                        ${renderList(s.troubleshooting.items, false)}
                        ${renderCallouts(s.troubleshooting.callouts)}
                    </div>
                </div>
            </div>
        `;
        document.dispatchEvent(new CustomEvent('mousescope:manualrendered'));
    }

    function renderCurrent() {
        const lang = window.manualCurrentLang ? window.manualCurrentLang() : 'zh';
        render(lang);
    }

    document.addEventListener('DOMContentLoaded', renderCurrent);
    document.addEventListener('mousescope:langchange', renderCurrent);
})();
</script>
