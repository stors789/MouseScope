                            ['<code>phase</code> / <code>segment_id</code> / <code>bin_index</code>', 'Which phase and bin the row belongs to.', 'Bins restart inside each segment.'],
                            ['<code>start_s</code> / <code>end_s</code> / <code>duration_s</code>', 'Within-segment time range.', 'The final bin may be shorter.'],
                            ['<code>distance_cm</code> / <code>mean_speed_cm_s</code>', 'Distance and speed in that bin.', 'Useful for activity dynamics.'],
                            ['<code>left_time_s</code> / <code>center_time_s</code> / <code>right_time_s</code>', 'Chamber occupancy in that bin.', 'Useful for phase time courses.'],
                            ['<code>left_interaction_time_s</code> / <code>right_interaction_time_s</code>', 'Cup interaction in that bin.', 'Shows whether approach is early or late.'],
                            ['<code>transitions</code>', 'Chamber transitions in that bin.', 'Helps assess exploration volume.']
                        ]
                    },
                    callouts: [
                        ['warning', 'Summary versus phase_summary', '<code>*_summary.csv</code> is the protocol overview. Use <code>*_phase_summary.csv</code> for phase-level review before formal interpretation.']
                    ]
                },
                batch: {
                    title: 'Batch Workflow',
                    lead: 'Batch 3CST analysis uses per-video setup followed by one combined run. Full-protocol videos especially require per-video timeline review.',
                    steps: [
                        'Upload multiple 3CST videos and set global timing, FPS override, and output folder.',
                        'Open each video card and choose full-protocol or single-phase mode.',
                        'For full protocol, verify every segment phase, start, end, and analyze state; set handling gaps to ignore.',
                        'Verify left and right cup roles for sociability and social_novelty, especially with counterbalanced designs.',
                        'Complete left / center / right chambers, cup points, optional door zones, and detection mask for each ROI.',
                        'Tune detection and interaction settings, then preview to ensure the stimulus mouse and cups are not misdetected.',
                        'Save the video setup, return to the batch page, and start only after every video is complete.'
                    ],
                    rules: [
                        'Each video stores its own analysis_mode, timeline, role_schedule, ROIs, cup points, masks, and parameters.',
                        'Multiple ROIs inside one video share the detection and statistics parameters for that video.',
                        'Invalid or empty full-protocol timelines block analysis start.',
                        'ROIs missing any main chamber or either cup point fail validation.'
                    ]
                },
                troubleshooting: {
                    title: 'Common Issues and Troubleshooting',
                    lead: '3CST troubleshooting should inspect timeline, roles, chamber zones, cup points, and detection quality together.',
                    items: [
                        'Sociability index direction looks inverted: check whether social and empty roles were swapped in the sociability phase.',
                        'Social novelty index direction looks inverted: check whether familiar and novel roles were swapped in social_novelty.',
                        'Interaction time is too high: check whether <code>interaction_radius_cm</code> is too large, cup points are off-center, or the path merely passes near the cup circle.',
                        'Interaction time is too low: check whether interaction radius is too small, cup points are misplaced, or <code>cup_exclusion_radius_cm</code> is too large.',
                        'Stimulus mouse is detected: increase <code>cup_exclusion_radius_cm</code>, refine the detection mask, or reduce reflections around the cup.',
                        'A phase is empty: check timeline coverage, analyze flags, and ROI time windows.',
                        'Transitions are very low: confirm chamber polygons have no gaps, detection rate is adequate, and the mouse truly enters side chambers.'
                    ],
                    callouts: [
                        ['danger', 'When summary alone is not enough', 'If roles, timeline, detection rate, cup points, or interaction circles are uncertain, do not rely only on <code>*_summary.csv</code>. Review the annotated video, <code>*_track.csv</code>, and <code>*_phase_summary.csv</code>.']
                    ]
                }
            }
        }
    };

    function renderList(items, ordered) {
        const tag = ordered ? 'ol' : 'ul';
        return `<${tag} class="${ordered ? 'manual-step-list' : 'manual-list'}">${(items || []).map(item => `<li>${item}</li>`).join('')}</${tag}>`;
    }

    function renderCards(cards) {
        return `
            <div class="manual-hero-grid">
                ${(cards || []).map(card => `
                    <div class="manual-mini-card">
                        <h4><i class="${card[0]}" style="color: var(--primary-color);"></i><span>${card[1]}</span></h4>
                        <p>${card[2]}</p>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function renderBlocks(blocks) {
        return (blocks || []).map(block => `
            <div class="manual-sub-block">
                <h4><i class="${block.icon}" style="color: var(--primary-color);"></i><span>${block.title}</span></h4>
                ${renderList(block.items, false)}
            </div>
        `).join('');
    }

    function renderCallouts(callouts) {
        return (callouts || []).map(item => `
            <div class="manual-callout ${item[0]}">
                <h4>${item[1]}</h4>
                <p>${item[2]}</p>
            </div>
        `).join('');
    }

    function renderFileGrid(files) {
        return `
            <div class="manual-file-grid">
                ${(files || []).map(file => `
                    <div class="manual-file-card">
                        <h4><i class="fas fa-file-alt" style="color: var(--primary-color);"></i><span>${file[0]}</span></h4>
                        <p>${file[1]}</p>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function render(lang) {
        const copy = THREE_CHAMBER_MANUAL[lang] || THREE_CHAMBER_MANUAL.zh;
        const s = copy.sections || {};
        const root = document.getElementById('three-chamber-manual-root');
        if (!root) return;
        root.innerHTML = `
            <div class="manual-hero">
                <div class="manual-hero-top">
                    <div>
                        <div class="manual-eyebrow">${copy.heroEyebrow}</div>
                        <h2>${copy.heroTitle}</h2>
                        <p>${copy.heroSubtitle}</p>
                    </div>
                    <div class="manual-chip-row">
                        ${copy.heroChips.map(chip => `<span class="manual-chip">${chip}</span>`).join('')}
                    </div>
                </div>
                ${renderCards(copy.heroCards)}
            </div>

            ${window.manualRenderFlow(copy.flow)}

            <div class="row">
                <div class="col-lg-3 mb-4">
                    <div class="nav-sidebar list-group sticky-top" style="top: 20px; z-index: 1;">
                        ${copy.nav.map((item, index) => `
                            <a href="#${item[0]}" class="list-group-item list-group-item-action">
                                <span class="step-number" style="width:26px;height:26px;font-size:0.8rem;">${index + 1}</span><span>${item[1]}</span>
                            </a>
                        `).join('')}
                    </div>
                </div>
                <div class="col-lg-9">
                    <div class="manual-section" id="overview">
                        <h3><span class="step-number">1</span><span>${s.overview.title}</span></h3>
                        <p>${s.overview.lead}</p>
                        ${renderList(s.overview.points, false)}
                        ${renderCallouts(s.overview.callouts)}
                    </div>

                    <div class="manual-section" id="recording">
                        <h3><span class="step-number">2</span><span>${s.recording.title}</span></h3>
                        <p>${s.recording.lead}</p>
                        ${renderBlocks(s.recording.blocks)}
                        ${renderCallouts(s.recording.callouts)}
                    </div>

                    <div class="manual-section" id="upload">
                        <h3><span class="step-number">3</span><span>${s.upload.title}</span></h3>
                        <p>${s.upload.lead}</p>
                        ${renderList(s.upload.points, false)}
                        ${renderCallouts(s.upload.callouts)}
                    </div>

                    <div class="manual-section" id="calibration">
                        <h3><span class="step-number">4</span><span>${s.calibration.title}</span></h3>
                        <p>${s.calibration.lead}</p>
                        ${renderBlocks(s.calibration.blocks)}
                        <div class="manual-caption"><i class="fas fa-timeline" style="color: var(--primary-color);"></i><span>${lang === 'en' ? 'Phase definitions' : '阶段定义'}</span></div>
                        ${window.manualRenderTable(s.calibration.phaseTable.headers, s.calibration.phaseTable.rows)}
                        <div class="manual-caption"><i class="fas fa-clock" style="color: var(--primary-color);"></i><span>${lang === 'en' ? 'ROI time-window modes' : 'ROI 时间窗模式'}</span></div>
                        ${window.manualRenderTable(s.calibration.timeTable.headers, s.calibration.timeTable.rows)}
                        ${renderCallouts(s.calibration.callouts)}
                    </div>

                    <div class="manual-section" id="params">
                        <h3><span class="step-number">5</span><span>${s.params.title}</span></h3>
                        <p>${s.params.lead}</p>
                        <div class="manual-caption"><i class="fas fa-search" style="color: var(--primary-color);"></i><span>${lang === 'en' ? 'Detection parameters' : '检测参数'}</span></div>
                        ${window.manualRenderTable(s.params.detectTable.headers, s.params.detectTable.rows)}
                        <div class="manual-caption"><i class="fas fa-chart-line" style="color: var(--primary-color);"></i><span>${lang === 'en' ? 'Interaction and statistics parameters' : '交互与统计参数'}</span></div>
                        ${window.manualRenderTable(s.params.statsTable.headers, s.params.statsTable.rows)}
                        ${renderCallouts(s.params.callouts)}
                    </div>

                    <div class="manual-section" id="outputs">
                        <h3><span class="step-number">6</span><span>${s.outputs.title}</span></h3>
                        <p>${s.outputs.lead}</p>
                        ${renderFileGrid(s.outputs.files)}
                        <div class="manual-caption"><i class="fas fa-table" style="color: var(--primary-color);"></i><span><code>*_track.csv</code></span></div>
                        ${window.manualRenderTable(s.outputs.trackTable.headers, s.outputs.trackTable.rows)}
                        <div class="manual-caption"><i class="fas fa-table" style="color: var(--primary-color);"></i><span><code>*_summary.csv</code></span></div>
                        ${window.manualRenderTable(s.outputs.summaryTable.headers, s.outputs.summaryTable.rows)}
                        <div class="manual-caption"><i class="fas fa-table" style="color: var(--primary-color);"></i><span><code>*_phase_summary.csv</code></span></div>
                        ${window.manualRenderTable(s.outputs.phaseTable.headers, s.outputs.phaseTable.rows)}
                        <div class="manual-caption"><i class="fas fa-table" style="color: var(--primary-color);"></i><span><code>*_bins.csv</code></span></div>
                        ${window.manualRenderTable(s.outputs.binsTable.headers, s.outputs.binsTable.rows)}
                        ${renderCallouts(s.outputs.callouts)}
                    </div>

                    <div class="manual-section" id="batch">
                        <h3><span class="step-number">7</span><span>${s.batch.title}</span></h3>
                        <p>${s.batch.lead}</p>
                        ${renderList(s.batch.steps, true)}
                        <div class="manual-sub-block">
                            <h4><i class="fas fa-check-double" style="color: var(--primary-color);"></i><span>${lang === 'en' ? 'Rules that matter in practice' : '真正需要记住的规则'}</span></h4>
                            ${renderList(s.batch.rules, false)}
                        </div>
                    </div>

                    <div class="manual-section" id="troubleshooting">
                        <h3><span class="step-number">8</span><span>${s.troubleshooting.title}</span></h3>
                        <p>${s.troubleshooting.lead}</p>
                        ${renderList(s.troubleshooting.items, false)}
                        ${renderCallouts(s.troubleshooting.callouts)}
                    </div>
                </div>
            </div>
        `;
        document.dispatchEvent(new CustomEvent('mousescope:manualrendered'));
    }

    function renderCurrent() {
        const lang = window.manualCurrentLang ? window.manualCurrentLang() : 'zh';
        render(lang);
    }

    document.addEventListener('DOMContentLoaded', renderCurrent);
    document.addEventListener('mousescope:langchange', renderCurrent);
})();
</script>
