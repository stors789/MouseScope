                            ['<code>interaction_radius_cm</code> / <code>exploration_max_speed_cm_s</code> / <code>movement_threshold_cm_s</code> / <code>min_valid_exploration_s</code>', 'Key decision parameters recorded into the summary.', 'Useful for provenance.'],
                            ['<code>use_head_direction</code> / <code>head_angle_threshold_deg</code> / <code>head_confidence_threshold</code>', 'Head-direction-assistance settings.', 'Useful for provenance.'],
                            ['<code>head_estimated_rate_percent</code> / <code>head_confident_rate_percent</code>', 'How often head direction was estimated at all, and how often it was confident enough.', 'Helps quantify how much head-direction logic really participated.'],
                            ['<code>arena_width_cm</code> / <code>arena_height_cm</code>', 'Real arena dimensions used for correction.', 'Define centimeter-space scaling.'],
                            ['<code>object_1_name</code> / <code>object_2_name</code>', 'Object names.', 'Taken from calibration.'],
                            ['<code>object_1_role</code> / <code>object_2_role</code>', 'Object roles.', 'Usually familiar and novel in recognition.'],
                            ['<code>object_1_exploration_s</code> / <code>object_2_exploration_s</code>', 'Total exploration time assigned to each object.', 'Final exploration totals after all gating logic.'],
                            ['<code>object_1_zone_time_s</code> / <code>object_2_zone_time_s</code>', 'Total time spent inside each object interaction radius.', 'Interaction-zone time is not the same as true exploration time.'],
                            ['<code>object_1_zone_entries</code> / <code>object_2_zone_entries</code>', 'Number of entries into each interaction zone.', 'Describes approach frequency.'],
                            ['<code>object_1_bouts</code> / <code>object_2_bouts</code>', 'Exploration bout counts.', 'Counted from exploration-start events.'],
                            ['<code>object_1_latency_s</code> / <code>object_2_latency_s</code>', 'Latency to first exploration of each object.', 'Measured from the ROI analysis-window start.'],
                            ['<code>total_object_exploration_s</code>', 'Total exploration time across both objects.', 'Core total-exploration output.'],
                            ['<code>head_supported_exploration_s</code>', 'Exploration time confirmed with confident head-direction support.', 'Shows how much exploration was validated by head gating.'],
                            ['<code>fallback_exploration_s</code>', 'Exploration time assigned via fallback distance rules because head confidence was insufficient.', 'If this is very high, head-direction assist was not contributing much in practice.'],
                            ['<code>meets_min_exploration</code>', 'Whether total exploration reached the minimum valid threshold.', 'QC flag, not a final verdict.'],
                            ['<code>first_explored_object</code> / <code>first_explored_role</code>', 'The first object and role explored.', 'Useful for first-choice analysis.'],
                            ['<code>familiar_exploration_s</code> / <code>novel_exploration_s</code>', 'Role-wise exploration time in recognition.', 'Only present in recognition phase.'],
                            ['<code>discrimination_index</code>', 'Recognition-phase DI = (novel - familiar) / (novel + familiar).', 'Usually ranges between -1 and 1.'],
                            ['<code>preference_index_percent</code>', 'Recognition-phase novel exploration as a percent of total role exploration.', 'Around 50% suggests no clear novel preference.'],
                            ['<code>difference_seconds</code>', 'Recognition-phase difference between novel and familiar exploration time.', 'Positive values mean more novel exploration.'],
                            ['<code>novel_preference</code>', 'Whether novel exploration exceeded familiar exploration.', 'Boolean quick-screening field.'],
                            ['<code>object_balance_index</code>', 'Familiarization-phase balance index between the two objects.', 'Only present in familiarization; values near 0 are more balanced.']
                        ]
                    },
                    binsTable: {
                        headers: ['Field', 'Meaning', 'How to interpret it'],
                        rows: [
                            ['<code>video_name</code> / <code>roi_id</code> / <code>roi_name</code>', 'Which video and ROI the bin belongs to.', 'Group by these before plotting time series.'],
                            ['<code>bin_index</code> / <code>start_s</code> / <code>end_s</code> / <code>duration_s</code>', 'Time-bin index and duration metadata.', 'The last bin may be shorter than the requested duration.'],
                            ['<code>distance_cm</code> / <code>mean_speed_cm_s</code>', 'Distance and average speed within the bin.', 'Useful for movement dynamics over time.'],
                            ['<code>center_time_s</code> / <code>moving_time_s</code>', 'Center occupancy and movement time within the bin.', 'Provides spatial and locomotor dynamics over time.'],
                            ['<code>object_1_exploration_s</code> / <code>object_2_exploration_s</code>', 'Per-object exploration time inside the bin.', 'Useful for exploration-time curves.'],
                            ['<code>total_object_exploration_s</code>', 'Total exploration time inside the bin.', 'Tracks global exploration dynamics.'],
                            ['<code>familiar_exploration_s</code> / <code>novel_exploration_s</code>', 'Role-wise bin exploration time in recognition.', 'Only present in recognition phase.'],
                            ['<code>discrimination_index</code> / <code>preference_index_percent</code>', 'Recognition-phase preference metrics computed per time bin.', 'Useful for checking whether preference strengthens or decays over time.']
                        ]
                    },
                    callouts: [
                        ['info', 'How to read exploration_mode', '<code>head</code> means confident head-direction gating passed; <code>fallback</code> means head confidence was too low so distance rules were used; <code>proximity</code> means head-direction assist was disabled and only distance rules were used.']
                    ]
                },
                batch: {
                    title: 'Batch workflow',
                    lead: 'NOR now supports full per-video configuration followed by one combined batch run. The correct workflow is to finish phase, arena, object, mask, time-window, and tuning setup for every video before starting analysis.',
                    steps: [
                        'Upload multiple NOR videos and set the global time range, FPS override, and output directory.',
                        'Switch through videos one by one and set phase, arena width and height, then complete 4-corner plus 2-object calibration for every ROI in that video.',
                        'Fill object names, roles, and ROI names, and draw detection masks where needed.',
                        'Set the proper time mode and precise time window for each ROI.',
                        'Move to the tuning step and adjust detection, spatial, and exploration parameters for the current video until all ROIs in that video preview cleanly.',
                        'Repeat for every video until all are fully configured.',
                        'Start the batch. The system processes videos sequentially and stores each video in its own child folder.'
                    ],
                    rules: [
                        'In batch mode, each video stores its own phase, arena size, ROI geometry, object points, masks, time windows, and tuning parameters.',
                        'Multiple ROIs inside the same video still share one tuning set.',
                        'If a video is missing arena points, object points, or valid mask configuration, the batch is blocked before start.',
                        'ZIP downloads preserve one child directory per video.'
                    ]
                },
                troubleshooting: {
                    title: 'Common issues and troubleshooting',
                    lead: 'The hardest part of NOR is not merely detecting the mouse. It is separating “being near an object” from “truly exploring an object.” Troubleshooting should therefore look at distance, head direction, and object geometry together.',
                    items: [
                        'If total exploration is much lower than expected, first check whether interaction radius is too small, exploration max speed is too low, or head-direction constraints are too strict.',
                        'If the mouse is often near an object but not counted as exploring it, inspect head-direction confidence, head-angle threshold, and whether the object point really sits at the object center.',
                        'If exploration assignment jumps between objects, check whether the objects are too close together, interaction zones overlap too strongly, or object centers are misplaced.',
                        'If <code>head_supported_exploration_s</code> is very low while fallback time is high, head-direction assist is contributing very little in practice, usually because contours are unstable, reflections are severe, or the confidence threshold is too high.',
                        'If <code>meets_min_exploration</code> is false, preference metrics should be interpreted more cautiously because total exploration volume is low.'
                    ],
                    callouts: [
                        ['danger', 'When result videos must be reviewed', 'If DI or preference index conflicts with visual impression, or if head-direction rates are low, total exploration is insufficient, or object assignment switches frequently, summary alone is not enough. Review the result video and <code>track.csv</code>.']
                    ]
                }
            }
        }
    };

    function renderList(items, ordered) {
        const tag = ordered ? 'ol' : 'ul';
        return `<${tag} class="${ordered ? 'manual-step-list' : 'manual-list'}">${(items || []).map(item => `<li>${item}</li>`).join('')}</${tag}>`;
    }

    function renderCards(cards) {
        return `
            <div class="manual-hero-grid">
                ${(cards || []).map(card => `
                    <div class="manual-mini-card">
                        <h4><i class="${card[0]}" style="color: var(--primary-color);"></i><span>${card[1]}</span></h4>
                        <p>${card[2]}</p>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function renderBlocks(blocks) {
        return (blocks || []).map(block => `
            <div class="manual-sub-block">
                <h4><i class="${block.icon}" style="color: var(--primary-color);"></i><span>${block.title}</span></h4>
                ${renderList(block.items, false)}
            </div>
        `).join('');
    }

    function renderCallouts(callouts) {
        return (callouts || []).map(item => `
            <div class="manual-callout ${item[0]}">
                <h4>${item[1]}</h4>
                <p>${item[2]}</p>
            </div>
        `).join('');
    }

    function renderFileGrid(files) {
        return `
            <div class="manual-file-grid">
                ${(files || []).map(file => `
                    <div class="manual-file-card">
                        <h4><i class="fas fa-file-alt" style="color: var(--primary-color);"></i><span>${file[0]}</span></h4>
                        <p>${file[1]}</p>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function render(lang) {
        const copy = NOR_MANUAL[lang] || NOR_MANUAL.zh;
        const s = copy.sections || {};
        const root = document.getElementById('nor-manual-root');
        if (!root) return;
        root.innerHTML = `
            <div class="manual-hero">
                <div class="manual-hero-top">
                    <div>
                        <div class="manual-eyebrow">${copy.heroEyebrow}</div>
                        <h2>${copy.heroTitle}</h2>
                        <p>${copy.heroSubtitle}</p>
                    </div>
                    <div class="manual-chip-row">
                        ${copy.heroChips.map(chip => `<span class="manual-chip">${chip}</span>`).join('')}
                    </div>
                </div>
                ${renderCards(copy.heroCards)}
            </div>

            ${window.manualRenderFlow(copy.flow)}

            <div class="row">
                <div class="col-lg-3 mb-4">
                    <div class="nav-sidebar list-group sticky-top" style="top: 20px; z-index: 1;">
                        ${copy.nav.map((item, index) => `
                            <a href="#${item[0]}" class="list-group-item list-group-item-action">
                                <span class="step-number" style="width:26px;height:26px;font-size:0.8rem;">${index + 1}</span><span>${item[1]}</span>
                            </a>
                        `).join('')}
                    </div>
                </div>
                <div class="col-lg-9">
                    <div class="manual-section" id="overview">
                        <h3><span class="step-number">1</span><span>${s.overview.title}</span></h3>
                        <p>${s.overview.lead}</p>
                        ${renderList(s.overview.points, false)}
                        ${renderCallouts(s.overview.callouts)}
                    </div>

                    <div class="manual-section" id="recording">
                        <h3><span class="step-number">2</span><span>${s.recording.title}</span></h3>
                        <p>${s.recording.lead}</p>
                        ${renderBlocks(s.recording.blocks)}
                        ${renderCallouts(s.recording.callouts)}
                    </div>

                    <div class="manual-section" id="upload">
                        <h3><span class="step-number">3</span><span>${s.upload.title}</span></h3>
                        <p>${s.upload.lead}</p>
                        ${renderList(s.upload.points, false)}
                        ${renderCallouts(s.upload.callouts)}
                    </div>

                    <div class="manual-section" id="calibration">
                        <h3><span class="step-number">4</span><span>${s.calibration.title}</span></h3>
                        <p>${s.calibration.lead}</p>
                        ${renderBlocks(s.calibration.blocks)}
                        <div class="manual-caption"><i class="fas fa-table" style="color: var(--primary-color);"></i><span>${lang === 'en' ? 'Phase and time-window definitions' : '阶段与时间窗定义'}</span></div>
                        ${window.manualRenderTable(s.calibration.timeTable.headers, s.calibration.timeTable.rows)}
                        ${renderCallouts(s.calibration.callouts)}
                    </div>

                    <div class="manual-section" id="params">
                        <h3><span class="step-number">5</span><span>${s.params.title}</span></h3>
                        <p>${s.params.lead}</p>
                        <div class="manual-caption"><i class="fas fa-search" style="color: var(--primary-color);"></i><span>${lang === 'en' ? 'Detection parameters' : '检测参数'}</span></div>
                        ${window.manualRenderTable(s.params.detectTable.headers, s.params.detectTable.rows)}
                        <div class="manual-caption"><i class="fas fa-brain" style="color: var(--primary-color);"></i><span>${lang === 'en' ? 'Exploration and statistics parameters' : '探索与统计参数'}</span></div>
                        ${window.manualRenderTable(s.params.statsTable.headers, s.params.statsTable.rows)}
                        ${renderCallouts(s.params.callouts)}
                    </div>

                    <div class="manual-section" id="outputs">
                        <h3><span class="step-number">6</span><span>${s.outputs.title}</span></h3>
                        <p>${s.outputs.lead}</p>
                        ${renderFileGrid(s.outputs.files)}
                        <div class="manual-caption"><i class="fas fa-table" style="color: var(--primary-color);"></i><span><code>*_track.csv</code></span></div>
                        ${window.manualRenderTable(s.outputs.trackTable.headers, s.outputs.trackTable.rows)}
                        <div class="manual-caption"><i class="fas fa-table" style="color: var(--primary-color);"></i><span><code>*_summary.csv</code></span></div>
                        ${window.manualRenderTable(s.outputs.summaryTable.headers, s.outputs.summaryTable.rows)}
                        <div class="manual-caption"><i class="fas fa-table" style="color: var(--primary-color);"></i><span><code>*_bins.csv</code></span></div>
                        ${window.manualRenderTable(s.outputs.binsTable.headers, s.outputs.binsTable.rows)}
                        ${renderCallouts(s.outputs.callouts)}
                    </div>

                    <div class="manual-section" id="batch">
                        <h3><span class="step-number">7</span><span>${s.batch.title}</span></h3>
                        <p>${s.batch.lead}</p>
                        ${renderList(s.batch.steps, true)}
                        <div class="manual-sub-block">
                            <h4><i class="fas fa-check-double" style="color: var(--primary-color);"></i><span>${lang === 'en' ? 'Rules that matter in practice' : '真正需要记住的规则'}</span></h4>
                            ${renderList(s.batch.rules, false)}
                        </div>
                    </div>

                    <div class="manual-section" id="troubleshooting">
                        <h3><span class="step-number">8</span><span>${s.troubleshooting.title}</span></h3>
                        <p>${s.troubleshooting.lead}</p>
                        ${renderList(s.troubleshooting.items, false)}
                        ${renderCallouts(s.troubleshooting.callouts)}
                    </div>
                </div>
            </div>
        `;
        document.dispatchEvent(new CustomEvent('mousescope:manualrendered'));
    }

    function renderCurrent() {
        const lang = window.manualCurrentLang ? window.manualCurrentLang() : 'zh';
        render(lang);
    }

    document.addEventListener('DOMContentLoaded', renderCurrent);
    document.addEventListener('mousescope:langchange', renderCurrent);
})();
</script>
